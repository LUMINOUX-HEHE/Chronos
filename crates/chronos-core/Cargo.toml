[package]
name = "chronos-core"
version = "0.3.2"
edition = "2024"
license = "UNLICENSED"
description = "Deterministic causal computation runtime and research platform"

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
name = "chronos_core"
path = "src/lib.rs"

[[bin]]
name = "chronos"
path = "src/bin/chronos.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[bench]]
name = "engine"
path = "benches/engine.rs"
harness = false
